<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An agentic AI reference implementation that automates SAP ERP accrual workflows on Amazon Bedrock AgentCore" />
    <meta property="og:title" content="Agentic ERP Automation Quickstart" />
    <meta property="og:description" content="An agentic AI reference implementation that automates SAP ERP accrual workflows on Amazon Bedrock AgentCore" />
    <title>Agentic ERP Automation Quickstart</title>
    <!-- Geist Sans (body), Geist Mono (ids/SAP values), Space Grotesk (display) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Space+Grotesk:wght@500..700&display=swap" rel="stylesheet">
    <script>
      // Inline and blocking on purpose: React mounts after first paint, so setting
      // .dark from a component flashes the light theme first. Mirrors useTheme.ts —
      // change both together.
      try {
        var p = localStorage.getItem("ui.theme")
        if (p === "dark" || ((!p || p === "system") && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
